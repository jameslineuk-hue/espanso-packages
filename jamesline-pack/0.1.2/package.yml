matches:
  - trigger: ":hello"
    replace: "Hello, world!"
  - trigger: ::ssh
    replace: "ssh-mini "
  - trigger: "::chm"
    replace: 'chmod +x "{{form1.filepath}}"'
    vars:
      - name: form1
        type: form
        params:
          layout: "File path: [[filepath]]"
  - trigger: ":chmodx"
    replace: 'chmod +x "{{filepath}}"'
    vars:
      - name: filepath
        type: shell
        params:
          cmd: "osascript -e 'POSIX path of (choose file with prompt \"Select a file\")'"

